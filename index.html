<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dadventure</title>
<meta name="description" content="Fourteen days of letters home, on a map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --paper:#EEF1EA;
    --paper-2:#E3E8DE;
    --ink:#1C261C;
    --ink-2:#4A574A;
    --ink-3:#7E8A7C;
    --route:#C8321F;
    --route-soft:#E4A398;
    --rule:#C9D0C4;
    --card-w:640px;
    --peek:14vh;      /* how much map shows above a card while it holds */
    --gap:130vh;      /* map-only breathing room between cards; the zoom happens here */
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--paper-2);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-optical-sizing:auto;font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--route);text-decoration-thickness:1px;text-underline-offset:3px}
  a:focus-visible{outline:3px solid #F2D14F;outline-offset:2px}

  /* ---------- map backdrop ---------- */
  #map{position:fixed;inset:0;z-index:0;background:var(--paper-2)}
  #canvas{width:100%;height:100%}
  .leaflet-container{font-family:inherit;background:var(--paper-2)}
  .leaflet-layer{transition:opacity .9s ease}
  .ovbase{filter:saturate(.55) sepia(.18) brightness(1.06)}
  .leaflet-control-attribution{font-size:9px;background:rgba(238,241,234,.8)}
  .gpinlabel{text-shadow:0 0 3px #EEF1EA,0 0 6px #EEF1EA,0 0 8px #EEF1EA}
  .maplabel{
    position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
    background:var(--ink);color:var(--paper);font-family:"Fraunces",serif;font-weight:500;font-size:14px;
    padding:6px 13px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transition:opacity .4s
  }
  .maplabel.on{opacity:1}
  .maplabel small{font-family:"Newsreader",serif;font-weight:400;opacity:.8;margin-left:8px}
  .maplabel .key{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-family:"Newsreader",serif;font-weight:400;font-size:13px;opacity:.9}
  .maplabel .key svg{display:block}
  .maplabel .key i{font-style:normal;margin-right:6px}
  .citylabel{background:none;border:0;box-shadow:none;padding:0;color:var(--ink);font-family:"Fraunces",serif;font-weight:600;font-size:13px;letter-spacing:.01em;white-space:nowrap;
    text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 6px #fff,0 0 8px #fff}
  .citylabel::before{display:none}

  /* ---------- opaque page ends ---------- */
  .hero,.end{position:relative;z-index:2;background:var(--paper)}
  .hero{padding:clamp(28px,7vw,64px) 22px 40px;border-bottom:1px solid var(--rule)}
  .hero>div,.end>div{max-width:var(--card-w);margin:0 auto}
  .hero h1{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 40,"WONK" 1;font-weight:600;font-size:clamp(56px,16vw,104px);line-height:.9;letter-spacing:-.02em;margin:0 0 14px}
  .hero .to{font-style:italic;font-size:22px;margin:0 0 6px}
  .hero .dates{color:var(--ink-2);margin:0}
  .hero .totals{margin:22px 0 0;display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:16px 28px;color:var(--ink-2);font-size:16px}
  .hero .totals b{display:block;font-family:"Fraunces",serif;font-weight:500;font-size:34px;line-height:1;color:var(--ink);font-variation-settings:"opsz" 72}
  .hero .hint{margin:34px 0 0;color:var(--ink-3);font-style:italic;font-size:17px}
  .end{padding:60px 22px 90px;border-top:1px solid var(--rule);color:var(--ink-2);font-style:italic}

  /* ---------- scrolling story ---------- */
  .story{position:relative;z-index:1}
  .gap{height:var(--gap)}
  .gap.first{height:200vh}
  .card{
    position:relative;max-width:var(--card-w);margin:0 12px;min-height:calc(100vh - var(--peek));
    background:var(--paper);border-radius:14px;padding:26px 22px 30px;
    box-shadow:0 -2px 0 rgba(28,38,28,.06),0 18px 50px rgba(28,38,28,.22)
  }
  @media (min-width:680px){.card{margin:0 auto}}
  .card header{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;margin-bottom:16px}
  .card .n{grid-row:span 2;font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"WONK" 1;font-weight:700;font-size:60px;line-height:.85;letter-spacing:-.03em;color:var(--route)}
  .card .n.cont{color:var(--route-soft)}
  .card .place{font-family:"Fraunces",serif;font-weight:500;font-size:22px;line-height:1.2;font-variation-settings:"opsz" 48}
  .card .meta{color:var(--ink-2);font-size:16px}
  .card .meta span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink-3);margin:0 9px 3px}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 18px}
  .photos figure{margin:0;aspect-ratio:4/3;background:var(--paper-2);overflow:hidden;border-radius:6px;position:relative}
  .photos figure:first-child:nth-last-child(odd){grid-column:span 2;aspect-ratio:3/2}
  .photos img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .missing{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;color:var(--ink-3);font-size:13px;border:1px dashed var(--rule);border-radius:6px;font-style:italic}
  .letter p{margin:0 0 1.1em;white-space:pre-line;max-width:60ch}
  .letter p:last-child{margin-bottom:0}
  .letter .sig{font-family:"Fraunces",serif;font-style:italic;font-weight:500}

  /* ---------- desktop: cards ride the right side so the map stays readable on the left ---------- */
  @media (min-width:1000px){
    :root{--card-w:560px}
    .card{margin:0 6vw 0 auto}
    .hero>div,.end>div{max-width:720px}
  }
</style>
</head>
<body>

<div id="map" aria-hidden="true"><div id="canvas"></div></div>
<div class="maplabel" id="maplabel"></div>

<header class="hero"><div>
  <h1 id="title">Dadventure</h1>
  <p class="to" id="to"></p>
  <p class="dates" id="dates"></p>
  <div class="totals" id="totals"></div>
  <p class="hint">Keep scrolling. The map follows the letters.</p>
</div></header>

<div class="story" id="story"></div>

<footer class="end"><div id="end"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CONTENT_URL='dadventure.md', ROUTE_URL='timeline.json', PHOTO_DIR='photos/';
const GOOGLE_MAPS_KEY='AIzaSyCWrlk6_XEtv_kE-oOaaOiYi5SxYJb50S8';   // paste your key here to use Google's terrain map; leave empty for Esri World Topo
const GOOGLE_MAP_ID='33dbae3225d3fdb37f6cdee9';   // optional: a vector Map ID from the Google Cloud console gives GPU-smooth zooming (styling then comes from the console)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the whole-trip overview (first map screen) ----------
   Anchor places labelled on the overview, in priority order: when labels would collide
   on a small screen, the ones further down the list are dropped. */
const OVERVIEW_PLACES=[
  {name:'Seattle',lat:47.6062,lng:-122.3321,dir:['left','top']},
  {name:'Boston',lat:42.3601,lng:-71.0589},
  {name:'Denver',lat:39.7392,lng:-104.9903},
  {name:'Montréal',lat:45.5019,lng:-73.5674,dir:'top'},
  {name:'Chicago',lat:41.8781,lng:-87.6298},
  {name:'Milwaukee',lat:43.0389,lng:-87.9065},
  {name:'Minocqua',lat:45.8711,lng:-89.7110,dir:'top'},
  {name:'Portland',lat:43.6591,lng:-70.2568,dir:'right'},
  {name:'Burlington',lat:44.4759,lng:-73.2121,dir:'left'},
];
const OVERVIEW_MIN_DRIVE_MI=20;   // drives smaller than this (city wandering) are left off the overview
// the overview sits on a quieter, label-free basemap so the route and the place names above carry the screen
const OVERVIEW_TILES='https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}';

/* ---------- content parser: days -> cards ---------- */
function parseContent(src){
  src=src.replace(/\r\n/g,'\n');
  const fm={}; let body=src;
  const m=src.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){ m[1].split('\n').forEach(l=>{const i=l.indexOf(':'); if(i>0) fm[l.slice(0,i).trim()]=l.slice(i+1).trim();}); body=src.slice(m[0].length); }
  body=body.replace(/<!--[\s\S]*?-->/g,'');
  const readMeta=lines=>{const meta={}; while(lines.length && /^[a-z]+:\s*.*$/i.test(lines[0]) && !/^https?:/i.test(lines[0])){const l=lines.shift();const i=l.indexOf(':');meta[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim();} return meta;};
  const days=[];
  body.split(/\n(?=## )/).map(s=>s.trim()).filter(s=>s.startsWith('## ')).forEach(block=>{
    const chunks=block.split(/\n---\n/);
    const lines=chunks[0].split('\n'); const heading=lines.shift().replace(/^##\s*/,'');
    const meta=readMeta(lines);
    const nm=heading.match(/\d+/);
    const day={n:nm?+nm[0]:days.length+1, date:meta.date||'', place:meta.place||heading, cards:[]};
    const first={text:lines.join('\n').trim(), photos:splitList(meta.photos), scene:meta.scene||''};
    day.cards.push(first);
    chunks.slice(1).forEach(c=>{const ls=c.trim().split('\n'); const mm=readMeta(ls); day.cards.push({text:ls.join('\n').trim(), photos:splitList(mm.photos), scene:mm.scene||''});});
    days.push(day);
  });
  return {fm,days};
}
const splitList=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderLetter(text){
  const paras=text.split(/\n\s*\n/);
  return paras.map((p,i)=>{
    let h=esc(p.replace(/\\([<>*])/g,'$1'));
    h=h.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}</a>`);
    const sig=i===paras.length-1 && /^(love|miss you|lots of love|dad|oh canada)/i.test(p.trim());
    return `<p${sig?' class="sig"':''}>${h}</p>`;
  }).join('');
}
const fmtDate=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});};

/* ---------- scenes: each card gets the matching scene of its day (in order) ---------- */
function assignScenes(dayContent, route){
  const scenes=route?route.scenes:[];
  return dayContent.cards.map((c,i)=>{
    if(!scenes.length) return null;
    const idx = c.scene? Math.max(0,Math.min(scenes.length-1,(+c.scene)-1)) : Math.min(i,scenes.length-1);
    return scenes[idx];
  });
}
const scenePoints=v=>[...(v.route||[]),...(v.flights||[]).flat(),...(v.pins||[]).map(p=>[p.lat,p.lng])];

/* ---------- map: Google terrain if a key is set, otherwise Esri topo via Leaflet ---------- */
const dist=(a,b)=>{const R=3959,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t;const h=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const STYLE={ hot:{casing:{color:'#FFFFFF',weight:5,opacity:.6},ground:{color:'#C8321F',weight:2.5,opacity:.85},air:{color:'#C8321F',weight:2,opacity:.85,dash:true}} };
const PIN={fill:'#1C261C',stroke:'#FFFFFF',r:5};
const OV_STYLE={ casing:{color:'#FFFFFF',weight:8,opacity:.85}, ground:{color:'#C8321F',weight:4,opacity:1},
                 air:{color:'#C8321F',weight:3.5,opacity:.95,dash:true,dashArray:'7 10',gap:17} };

/* ---------- geometry for the overview: simplify + smooth drives, arc the flights ---------- */
function rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  const [a,b]=[pts[0],pts.at(-1)]; let md=0,mi=0;
  for(let i=1;i<pts.length-1;i++){ const d=segDist(pts[i],a,b); if(d>md){md=d;mi=i;} }
  if(md<=eps) return [a,b];
  return [...rdp(pts.slice(0,mi+1),eps).slice(0,-1),...rdp(pts.slice(mi),eps)];
}
function segDist(p,a,b){ const k=Math.cos(a[0]*Math.PI/180); const [px,py,ax,ay,bx,by]=[p[1]*k,p[0],a[1]*k,a[0],b[1]*k,b[0]];
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-ax-t*dx,py-ay-t*dy); }
function chaikin(pts,n){ for(let r=0;r<n;r++){ const o=[pts[0]]; for(let i=0;i<pts.length-1;i++){ const [a,b]=[pts[i],pts[i+1]];
  o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]); } o.push(pts.at(-1)); pts=o; } return pts; }
function arc(a,b,n=48){
  // gentle curve that bulges north, like a great-circle route looks on a flat map
  const k=Math.cos((a[0]+b[0])/2*Math.PI/180), ax=a[1]*k, bx=b[1]*k, mx=(ax+bx)/2, my=(a[0]+b[0])/2;
  // eastbound legs bow north, westbound legs bow south, so out-and-back flights read as one loop
  let nx=-(b[0]-a[0]), ny=bx-ax; if((ny<0)!==(bx<ax)){nx=-nx;ny=-ny;}
  const len=Math.hypot(nx,ny)||1, h=Math.hypot(bx-ax,b[0]-a[0])*.16, cx=mx+nx/len*h, cy=my+ny/len*h, out=[];
  for(let i=0;i<=n;i++){ const t=i/n, u=1-t; out.push([u*u*a[0]+2*u*t*cy+t*t*b[0], (u*u*ax+2*u*t*cx+t*t*bx)/k]); }
  return out;
}
function buildOverview(routes){
  const drives=[], flights=[];
  routes.forEach(r=>r.scenes.forEach(v=>{
    const rt=v.route||[];
    if(rt.length>1){ const la=rt.map(p=>p[0]), ln=rt.map(p=>p[1]);
      if(dist([Math.min(...la),Math.min(...ln)],[Math.max(...la),Math.max(...ln)])>=OVERVIEW_MIN_DRIVE_MI) drives.push(chaikin(rdp(rt,.012),3)); }
    (v.flights||[]).forEach(f=>flights.push(arc(f[0],f[1])));
  }));
  return {drives,flights};
}
// place overview labels so they stay on screen and clear of each other (xy: place -> screen point)
function placeLabels(xy){
  const kept=[], boxes=[], W=innerWidth, H=innerHeight;
  const hits=a=>boxes.some(o=>!(a.r<o.l||a.l>o.r||a.b<o.t||a.t>o.b));
  OVERVIEW_PLACES.forEach(p=>{ const q=xy(p), w=p.name.length*7.6+10, h=18, dot={l:q.x-6,r:q.x+6,t:q.y-6,b:q.y+6};
    if(q.x<0||q.x>W||q.y<0||q.y>H||hits(dot)) return;
    // preferred side(s) first, then the rest; above/below labels may slide sideways to stay on screen
    const prefs=[].concat(p.dir||[]);
    for(const d of [...new Set([...prefs,'bottom','top','right','left'])]){
      const o={bottom:[-w/2,6],top:[-w/2,-6-h],left:[-w-8,-h/2],right:[8,-h/2]}[d];
      let dx=0; if(d==='top'||d==='bottom'){ const l=q.x+o[0]; if(l<4) dx=4-l; if(l+w>W-4) dx=W-4-w-l; }
      const bx={l:q.x+o[0]+dx,r:q.x+o[0]+dx+w,t:q.y+o[1],b:q.y+o[1]+h};
      if(bx.l<4||bx.r>W-4||hits(bx)) continue;
      kept.push({...p,dir:d,dx}); boxes.push(bx,dot); return;
    }
  });
  return kept;
}
function padding(overview){
  const w=innerWidth;
  if(overview) return w>=1000?{top:90,left:70,right:70,bottom:60}:{top:76,left:18,right:18,bottom:40};
  if(w>=1000) return {top:80,left:40,right:Math.round(w*0.5),bottom:40};
  return {top:84,left:28,right:28,bottom:Math.round(innerHeight*0.25)};
}

/* ---------- camera: we fit views ourselves so the scroll position can scrub between them ---------- */
const TILE=256;
const merc=([lat,lng])=>{const s=Math.sin(Math.max(-85,Math.min(85,lat))*Math.PI/180); return [(lng+180)/360,.5-Math.log((1+s)/(1-s))/(4*Math.PI)];};
const unmerc=([x,y])=>[Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI, x*360-180];
function cameraFor(view){
  const overview=!view, pts=overview?ALL:scenePoints(view); if(!pts.length) return null;
  const P=padding(overview), W=innerWidth, H=innerHeight, m=pts.map(merc);
  let x0=Math.min(...m.map(p=>p[0])), x1=Math.max(...m.map(p=>p[0])), y0=Math.min(...m.map(p=>p[1])), y1=Math.max(...m.map(p=>p[1]));
  const pf=overview?.02:pts.length<3?.6:.08, px=(x1-x0)*pf, py=(y1-y0)*pf; x0-=px; x1+=px; y0-=py; y1+=py;
  const maxZ=overview?6:(view.route&&view.route.length>1)?15:13;
  const aw=Math.max(60,W-P.left-P.right), ah=Math.max(60,H-P.top-P.bottom);
  const z=Math.max(2,Math.min(maxZ,Math.log2(Math.min(aw/((x1-x0)*TILE),ah/((y1-y0)*TILE))))), ws=TILE*2**z;
  return {x:(x0+x1)/2-(P.left-P.right)/2/ws, y:(y0+y1)/2-(P.top-P.bottom)/2/ws, z};
}
const camXY=(cam,lat,lng)=>{const [mx,my]=merc([lat,lng]), ws=TILE*2**cam.z; return {x:innerWidth/2+(mx-cam.x)*ws, y:innerHeight/2+(my-cam.y)*ws};};
// smooth pan-and-zoom path between two views (van Wijk & Nuij): long hops rise up and come back down
function zoomPath(a,b,rho=1.4){
  const [ux0,uy0,w0]=a,[ux1,uy1,w1]=b, dx=ux1-ux0, dy=uy1-uy0, d2=dx*dx+dy*dy, r2=rho*rho;
  if(d2<1e-18){ const S=Math.log(w1/w0)/rho; return t=>[ux0+t*dx,uy0+t*dy,w0*Math.exp(rho*t*S)]; }
  const d1=Math.sqrt(d2), b0=(w1*w1-w0*w0+r2*r2*d2)/(2*w0*r2*d1), b1=(w1*w1-w0*w0-r2*r2*d2)/(2*w1*r2*d1),
        q0=Math.log(Math.sqrt(b0*b0+1)-b0), q1=Math.log(Math.sqrt(b1*b1+1)-b1), S=(q1-q0)/rho;
  return t=>{ const s=t*S, c=Math.cosh(q0), u=w0/(r2*d1)*(c*Math.tanh(rho*s+q0)-Math.sinh(q0)); return [ux0+u*dx,uy0+u*dy,w0*c/Math.cosh(rho*s+q0)]; };
}
function lerpCam(a,b,t){
  if(t<=0) return a; if(t>=1) return b;
  const W=innerWidth, [x,y,w]=zoomPath([a.x,a.y,W/(TILE*2**a.z)],[b.x,b.y,W/(TILE*2**b.z)])(t);
  return {x,y,z:Math.log2(W/(TILE*w))};
}
let ALL=[], mapApi;

/* Leaflet + Esri World Topo */
const leafletMap={
  active:null,
  init(){
    this.map=L.map('canvas',{zoomControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false,zoomSnap:0,fadeAnimation:false});
    this.base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS, NGA, and others'}).addTo(this.map);
    this.map.createPane('cities').style.zIndex=450;
    this.ovBase=L.tileLayer(OVERVIEW_TILES,{maxZoom:13,maxNativeZoom:13,className:'ovbase',opacity:0}).addTo(this.map);
    this.map.setView([44,-90],4);
    addEventListener('resize',()=>this.map.invalidateSize());
  },
  line(pts,st,group){ return L.polyline(pts,{color:st.color,weight:st.weight,opacity:st.opacity,dashArray:st.dash?(st.dashArray||'2 8'):null,lineCap:'round',lineJoin:'round',smoothFactor:st.dashArray?0:1,interactive:false}).addTo(group||this.map); },
  draw(v,style,group){ if(v.route&&v.route.length>1){ if(style.casing) this.line(v.route,style.casing,group); this.line(v.route,style.ground,group);} (v.flights||[]).forEach(f=>this.line(f,style.air,group)); },
  whole(routes){
    this.overview=L.layerGroup(); this.cities=L.layerGroup().addTo(this.overview);
    const ov=buildOverview(routes);
    ov.drives.forEach(d=>this.line(d,OV_STYLE.casing,this.overview));
    ov.flights.forEach(f=>this.line(f,OV_STYLE.air,this.overview));
    ov.drives.forEach(d=>this.line(d,OV_STYLE.ground,this.overview));
  },
  scene(view){
    if(this.active){this.map.removeLayer(this.active);this.active=null;}
    // each day screen shows only its own route: no stop dots, no faint lines from other days
    if(!view){ this.overview.addTo(this.map); }
    else { this.map.removeLayer(this.overview); this.active=L.layerGroup().addTo(this.map); this.draw(view,STYLE.hot,this.active); }
    this.ovBase.setOpacity(view?0:1);
  },
  labelCities(places){
    this.cities.clearLayers();
    places.forEach(p=>{ const off={bottom:[p.dx,4],top:[p.dx,-4],left:[-4,0],right:[4,0]}[p.dir];
      L.circleMarker([p.lat,p.lng],{pane:'cities',radius:4,color:'#FFFFFF',weight:2,fillColor:PIN.fill,fillOpacity:1,interactive:false})
       .bindTooltip(p.name,{permanent:true,direction:p.dir,offset:off,className:'citylabel'}).addTo(this.cities); });
  },
  camera(c){ const [lat,lng]=unmerc([c.x,c.y]); this.map.setView([lat,lng],c.z,{animate:false}); }
};

/* Google Maps terrain */
const googleMap={
  active:[],
  async init(){
    await new Promise((res,rej)=>{window.__gmReady=res;const sc=document.createElement('script');sc.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&v=weekly&loading=async&callback=__gmReady`;sc.onerror=rej;document.head.appendChild(sc);});
    const base={disableDefaultUI:true,gestureHandling:'none',keyboardShortcuts:false,clickableIcons:false,isFractionalZoomEnabled:true,center:{lat:44,lng:-90},zoom:4};
    this.vector=!!GOOGLE_MAP_ID;
    this.map=new google.maps.Map(document.getElementById('canvas'),this.vector?{...base,mapId:GOOGLE_MAP_ID,renderingType:'VECTOR'}:{...base,mapTypeId:'terrain'});
  },
  line(pts,st,bucket){
    const opts={path:pts.map(p=>({lat:p[0],lng:p[1]})),strokeColor:st.color,strokeOpacity:st.dash?0:st.opacity,strokeWeight:st.weight,clickable:false,map:this.map};
    if(st.dash) opts.icons=[{icon:{path:'M 0,-1 0,1',strokeOpacity:st.opacity,strokeWeight:st.weight,scale:st.gap?3:1.5},offset:'0',repeat:(st.gap||12)+'px'}];
    const pl=new google.maps.Polyline(opts); if(bucket) bucket.push(pl); return pl;
  },
  draw(v,style,bucket){ if(v.route&&v.route.length>1){ if(style.casing) this.line(v.route,style.casing,bucket); this.line(v.route,style.ground,bucket);} (v.flights||[]).forEach(f=>this.line(f,style.air,bucket)); },
  whole(routes){
    this.overview=[]; this.cities=[];
    const ov=buildOverview(routes);
    ov.drives.forEach(d=>this.line(d,OV_STYLE.casing,this.overview));
    ov.flights.forEach(f=>this.line(f,OV_STYLE.air,this.overview));
    ov.drives.forEach(d=>this.line(d,OV_STYLE.ground,this.overview));
  },
  scene(view){
    this.active.forEach(m=>m.setMap(null)); this.active=[];
    const on=!view;
    if(!this.vector) this.map.setOptions({styles:on?[{elementType:'labels',stylers:[{visibility:'off'}]}]:null});
    [...this.overview,...this.cities].forEach(m=>m.setMap(on?this.map:null));
    if(view) this.draw(view,STYLE.hot,this.active);   // only this screen's route: no stop dots, no faint lines from other days
  },
  labelCities(places){
    this.cities.forEach(m=>m.setMap(null)); this.cities=[];
    places.forEach(p=>{ const w=p.name.length*7.6/8+2.5, o={bottom:[p.dx/4,3.4],top:[p.dx/4,-2.6],left:[-w,.4],right:[w,.4]}[p.dir];
      this.cities.push(new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map:this.map,clickable:false,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:4,fillColor:PIN.fill,fillOpacity:1,strokeColor:'#FFFFFF',strokeWeight:2,labelOrigin:new google.maps.Point(o[0],o[1])},
        label:{text:p.name,color:'#1C261C',fontFamily:'Fraunces, serif',fontSize:'13px',fontWeight:'600',className:'gpinlabel'}})); });
  },
  camera(c){ const [lat,lng]=unmerc([c.x,c.y]);
    if(this.vector) this.map.moveCamera({center:{lat,lng},zoom:c.z}); else this.map.setOptions({center:{lat,lng},zoom:c.z}); }   // moveCamera is a no-op on raster maps
};
async function initMap(){
  mapApi = GOOGLE_MAPS_KEY ? googleMap : leafletMap;
  // If Google rejects the key (not enabled, wrong referrer, billing off) fall back to Esri so the page still works
  window.gm_authFailure=()=>{ console.warn('Google Maps rejected the key; using Esri World Topo instead.'); const c=document.getElementById('canvas'); c.replaceWith(Object.assign(document.createElement('div'),{id:'canvas'})); mapApi=leafletMap; leafletMap.init(); mapApi.whole(ROUTES); state=undefined; render(); };
  try{ await mapApi.init(); }catch(e){ mapApi=leafletMap; await mapApi.init(); }
}
let ROUTES=[];
function drawWholeTrip(routes){ ROUTES=routes; routes.forEach(r=>r.scenes.forEach(v=>ALL.push(...scenePoints(v)))); mapApi.whole(routes); }

/* ---------- build ---------- */
let CARDS=[];
async function main(){
  let md,tl;
  try{ [md,tl]=await Promise.all([fetch(CONTENT_URL).then(r=>r.text()),fetch(ROUTE_URL).then(r=>r.json())]); }
  catch(e){ if(window.__INLINE){md=window.__INLINE.md;tl=window.__INLINE.tl;} else {document.getElementById('story').innerHTML='<div class="card"><p>Could not load <code>dadventure.md</code> / <code>timeline.json</code>. Open the page from a web server (or GitHub Pages), or open preview.html.</p></div>';return;} }
  const {fm,days}=parseContent(md);
  const byDate=Object.fromEntries(tl.map(r=>[r.date,r]));

  document.getElementById('title').textContent=fm.title||'Dadventure'; document.title=fm.title||'Dadventure';
  const to=splitList(fm.to);
  document.getElementById('to').textContent=to.length?`Letters home to ${to.length>1?to.slice(0,-1).join(', ')+' and '+to.at(-1):to[0]}`:(fm.subtitle||'');
  if(days.length) document.getElementById('dates').textContent=`${fmtDate(days[0].date)} to ${fmtDate(days.at(-1).date)}, ${days.at(-1).date.slice(0,4)}`;
  const used=days.map(d=>byDate[d.date]).filter(Boolean);
  const ground=used.reduce((s,r)=>s+r.groundMi,0), air=used.reduce((s,r)=>s+r.flightMi,0);
  document.getElementById('totals').innerHTML=`<div><b>${days.length}</b>days</div><div><b>${ground.toLocaleString()}</b>miles on the ground</div><div><b>${air.toLocaleString()}</b>miles in the air</div>`;
  document.getElementById('end').textContent='Written on the road, one night at a time.';

  let html='<div class="gap first"></div>'; let k=0;
  days.forEach(day=>{
    const views=assignScenes(day, byDate[day.date]);
    day.cards.forEach((c,ci)=>{
      const v=views[ci]; CARDS.push({day,card:c,view:v});
      const photos=c.photos.length?`<div class="photos">${c.photos.map(p=>`<figure><img src="${PHOTO_DIR+p}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'${esc(p)}'}))"></figure>`).join('')}</div>`:'';
      html+=`<article class="card" data-k="${k++}">
        <header><div class="n${ci?' cont':''}">${day.n}</div><div class="place">${esc(day.place)}</div>
        <div class="meta"><span>${fmtDate(day.date)}</span>${v&&v.label?`<span>${esc(v.label)}</span>`:''}</div></header>
        ${photos}<div class="letter">${renderLetter(c.text)}</div></article><div class="gap"></div>`;
    });
  });
  document.getElementById('story').innerHTML=html;

  await initMap(); drawWholeTrip(used);
  layout(); onScroll(true);
  addEventListener('scroll',()=>onScroll(),{passive:true});
  addEventListener('resize',()=>{layout();onScroll(true);});
  document.fonts && document.fonts.ready.then(()=>{layout();onScroll(true);});
}
/* ---------- scroll: each gap between cards scrubs the camera from the last view to the next ---------- */
let SEG=[], CAMS=[], OVCAM=null, state;
// the map follows a softened copy of the scroll position, so wheel clicks and trackpad flicks glide instead of jump
const FOLLOW_MS=140;   // lower = snappier, higher = floatier
let yNow=null, yGoal=0, loop=0, last=0;
function layout(){
  const H=innerHeight, cards=[...document.querySelectorAll('.card')];
  OVCAM=cameraFor(null);
  CAMS=CARDS.map(c=>c.view?cameraFor(c.view):null); CAMS.forEach((c,i)=>{ if(!c) CAMS[i]=i?CAMS[i-1]:OVCAM; });
  let prevBottom=document.querySelector('.hero').getBoundingClientRect().bottom+scrollY;
  SEG=cards.map((el,i)=>{ const r=el.getBoundingClientRect(), top=r.top+scrollY;
    // first gap: the overview holds for a beat once the title has scrolled away, then zooms toward Day 1
    const start=i===0?prevBottom+.35*H:prevBottom-.6*H, end=Math.max(start+1,top-.85*H);   // lands just before the card slides in
    prevBottom=r.bottom+scrollY; return {start,end}; });
  state=undefined;
}
function onScroll(force){
  yGoal=scrollY;
  if(force||yNow===null||REDUCED){ cancelAnimationFrame(loop); loop=0; yNow=yGoal; render(); return; }
  if(!loop){ last=performance.now(); loop=requestAnimationFrame(step); }
}
function step(now){
  const dt=Math.min(50,Math.max(0,now-last)); last=now;
  yNow+=(yGoal-yNow)*(1-Math.exp(-dt/FOLLOW_MS)); if(Math.abs(yGoal-yNow)<.5) yNow=yGoal;
  render(); loop=yNow!==yGoal?requestAnimationFrame(step):0;
}
function render(){
  if(!mapApi||!OVCAM) return;
  const y=yNow??scrollY; let i=-1;
  for(let k=0;k<SEG.length;k++){ if(SEG[k].start<=y) i=k; else break; }
  let cam=OVCAM, s=-1;
  if(i>=0){ const g=SEG[i]; let t=Math.max(0,Math.min(1,(y-g.start)/(g.end-g.start))); if(REDUCED) t=t<.5?0:1;
    const e=t*t*(3-2*t); cam=lerpCam(i?CAMS[i-1]:OVCAM, CAMS[i], e); s=t<.5?i-1:i; }
  const label=document.getElementById('maplabel');
  label.classList.toggle('on', s<0 && scrollY>innerHeight*0.4);   // the pill (with the drove/flew key) belongs to the whole-trip screen only
  if(s!==state){ state=s;
    const view=s<0?null:CARDS[s].view; mapApi.scene(view);
    if(s<0){ mapApi.labelCities(placeLabels(p=>camXY(OVCAM,p.lat,p.lng)));
      label.innerHTML=`The whole trip<span class="key"><svg width="22" height="6"><line x1="2" y1="3" x2="20" y2="3" stroke="#E4A398" stroke-width="3.5" stroke-linecap="round"/></svg><i>drove</i><svg width="24" height="6"><line x1="2" y1="3" x2="22" y2="3" stroke="#E4A398" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/></svg><i>flew</i></span>`; }
  }
  mapApi.camera(cam);
}
main();
</script>
